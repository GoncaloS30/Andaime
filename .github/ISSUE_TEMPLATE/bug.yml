name: Erro
description: Algo não funciona como devia.
title: '[Erro] '
labels: [tipo:erro, triagem]
body:
  - type: markdown
    attributes:
      value: Obrigado por reportar. Quanto mais concreto, mais depressa se corrige.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: O que viu, e o que esperava ver.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Entrar como gestor
        2. Abrir Planeamento, semana seguinte
        3. Arrastar um bloco para domingo
    validations:
      required: true
  - type: dropdown
    id: papel
    attributes:
      label: Papel
      options: [Gestor, Encarregado, Trabalhador (app), Modo apresentação]
    validations:
      required: true
  - type: dropdown
    id: dispositivo
    attributes:
      label: Dispositivo
      options: [Desktop, Tablet, Telemóvel]
  - type: input
    id: browser
    attributes:
      label: Browser e versão
      placeholder: Edge 141, Safari iOS 18…
  - type: textarea
    id: capturas
    attributes:
      label: Capturas ou consola
      description: Arraste imagens para aqui. Erros da consola (F12) ajudam muito.
