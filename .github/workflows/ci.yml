name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Um push novo no mesmo PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Tipos, lint e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e-saas:
    name: E2E e acessibilidade (API real, PostgreSQL, Mailpit, S3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Mesma infraestrutura do desenvolvimento (projeto Compose "andaime"): PostgreSQL, Mailpit e SeaweedFS (S3).
      - run: docker compose -f infra/compose.yaml up -d --wait postgres mailpit objectstore
      - run: ./mvnw -B -q package -DskipTests
        working-directory: backend
      # API real com a empresa de demonstração (credenciais locais de infra/.env.example), usada pelos testes de acessibilidade.
      - name: Arrancar a API
        run: |
          nohup java -jar backend/target/andaime-api-0.1.0-SNAPSHOT.jar --spring.profiles.active=local             --logging.structured.format.console= --andaime.seed.demo.enabled=true             --andaime.seed.demo.owner-email=demo@andaime.test             --andaime.seed.demo.owner-password=demo-local-andaime-2026 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8088/actuator/health/readiness && exit 0; sleep 3; done
          cat api.log; exit 1
      - run: npm ci
      - run: npx playwright install --with-deps msedge
      - run: npm run e2e:saas
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-saas
          path: |
            api.log
            test-results
          retention-days: 7

  backend:
    name: Backend (Spring Boot, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testes unitários, integração com PostgreSQL real, isolamento entre empresas e limites dos módulos.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: backend-surefire
          path: backend/target/surefire-reports
          retention-days: 7
      # Vulnerabilidades conhecidas nas dependências Java: SBOM das dependências de execução (versões resolvidas
      # pelo Maven) analisado pelo OSV-Scanner contra osv.dev. Falha a CI se houver vulnerabilidades conhecidas.
      - run: ./mvnw -B -q cyclonedx:makeBom
      - name: OSV-Scanner (dependências Java)
        run: docker run --rm -v "$PWD/target:/src:ro" ghcr.io/google/osv-scanner:v2.2.4 scan source -L /src/bom.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-sbom
          path: backend/target/bom.json
          retention-days: 30

  auditoria:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --audit-level=moderate
