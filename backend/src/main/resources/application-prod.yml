server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  flyway:
    clean-disabled: true

# Porta de gestão interna (health, Prometheus, info): não exposta pelo proxy. Com uma porta de gestão própria, todo o
# Actuator (health incluído) passa para ela; o proxy responde a /healthz para verificações externas.
management:
  server:
    port: ${ANDAIME_MANAGEMENT_PORT:8098}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Em produção as credenciais do armazenamento e o remetente dos emails vêm sempre do ambiente (sem valores por omissão).
andaime:
  mail:
    from: ${ANDAIME_MAIL_FROM}
  storage:
    access-key: ${ANDAIME_STORAGE_ACCESS_KEY}
    secret-key: ${ANDAIME_STORAGE_SECRET_KEY}
  # Em produção o antivírus está ligado por omissão; desligar exige ANDAIME_ANTIVIRUS_MODE=off explícito.
  antivirus:
    mode: ${ANDAIME_ANTIVIRUS_MODE:clamd}
    host: ${ANDAIME_ANTIVIRUS_HOST:clamav}
    port: ${ANDAIME_ANTIVIRUS_PORT:3310}
    timeout-ms: ${ANDAIME_ANTIVIRUS_TIMEOUT_MS:30000}
  # Chave dos segredos TOTP: obrigatória e sempre do ambiente (sem valor por omissão).
  # Trocá-la sem recifrar user_totp invalida a verificação em dois passos de todas as contas.
  security:
    totp-key: ${ANDAIME_TOTP_KEY}
