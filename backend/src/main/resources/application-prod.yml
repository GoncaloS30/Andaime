server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  flyway:
    clean-disabled: true

# Porta de gestão interna (Prometheus, info): não exposta pelo proxy; o health continua na porta pública.
management:
  server:
    port: ${ANDAIME_MANAGEMENT_PORT:8098}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Em produção as credenciais do armazenamento vêm sempre do ambiente (sem valores por omissão).
andaime:
  storage:
    access-key: ${ANDAIME_STORAGE_ACCESS_KEY}
    secret-key: ${ANDAIME_STORAGE_SECRET_KEY}
