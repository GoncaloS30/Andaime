server:
  port: 8088
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ANDAIME_SESSION
        http-only: true
        same-site: lax
      timeout: 8h

spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  application:
    name: andaime-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ANDAIME_DATABASE_URL:jdbc:postgresql://localhost:55442/andaime}
    username: ${ANDAIME_DATABASE_USER:andaime_app}
    password: ${ANDAIME_DATABASE_PASSWORD:andaime_app_local}
  flyway:
    enabled: true
    url: ${ANDAIME_DATABASE_URL:jdbc:postgresql://localhost:55442/andaime}
    user: ${ANDAIME_DATABASE_OWNER:andaime_owner}
    password: ${ANDAIME_DATABASE_OWNER_PASSWORD:andaime_owner_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
  mail:
    host: ${ANDAIME_MAIL_HOST:localhost}
    port: ${ANDAIME_MAIL_PORT:51035}
  threads:
    virtual:
      enabled: true

andaime:
  storage:
    endpoint: ${ANDAIME_STORAGE_ENDPOINT:http://localhost:59010}
    region: ${ANDAIME_STORAGE_REGION:eu-west-1}
    bucket: ${ANDAIME_STORAGE_BUCKET:andaime-documents}
    access-key: ${ANDAIME_STORAGE_ACCESS_KEY:andaime-local}
    secret-key: ${ANDAIME_STORAGE_SECRET_KEY:andaime-local-secret}
    max-file-bytes: 15728640

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    pt.andaime: INFO
