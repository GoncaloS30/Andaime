server:
  port: 8088
  # Respostas JSON grandes (ex.: quadro de planeamento com centenas de pessoas) comprimidas.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ANDAIME_SESSION
        http-only: true
        same-site: lax
      timeout: 8h

spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
  application:
    name: andaime-api
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ANDAIME_DATABASE_URL:jdbc:postgresql://localhost:55442/andaime}
    username: ${ANDAIME_DATABASE_USER:andaime_app}
    password: ${ANDAIME_DATABASE_PASSWORD:andaime_app_local}
  flyway:
    enabled: true
    url: ${ANDAIME_DATABASE_URL:jdbc:postgresql://localhost:55442/andaime}
    user: ${ANDAIME_DATABASE_OWNER:andaime_owner}
    password: ${ANDAIME_DATABASE_OWNER_PASSWORD:andaime_owner_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */15 * * * *"
  mail:
    host: ${ANDAIME_MAIL_HOST:localhost}
    port: ${ANDAIME_MAIL_PORT:51035}
  threads:
    virtual:
      enabled: true

andaime:
  # Remetente (cabeçalho From) de todos os emails; sem ele, os fornecedores de SMTP recusam ou reescrevem a mensagem.
  mail:
    from: ${ANDAIME_MAIL_FROM:Andaime <nao-responder@andaime.test>}
  storage:
    endpoint: ${ANDAIME_STORAGE_ENDPOINT:http://localhost:59010}
    region: ${ANDAIME_STORAGE_REGION:eu-west-1}
    bucket: ${ANDAIME_STORAGE_BUCKET:andaime-documents}
    access-key: ${ANDAIME_STORAGE_ACCESS_KEY:andaime-local}
    secret-key: ${ANDAIME_STORAGE_SECRET_KEY:andaime-local-secret}
    max-file-bytes: 15728640
  # Antivírus (ClamAV/clamd). "off" em desenvolvimento; em produção "clamd" (falha fechada: sem antivírus, sem upload).
  antivirus:
    mode: ${ANDAIME_ANTIVIRUS_MODE:off}
    host: ${ANDAIME_ANTIVIRUS_HOST:localhost}
    port: ${ANDAIME_ANTIVIRUS_PORT:59310}
    timeout-ms: ${ANDAIME_ANTIVIRUS_TIMEOUT_MS:30000}
  security:
    # Chave AES-256 (base64, 32 bytes) que cifra os segredos da verificação em dois passos.
    # Sem valor por omissão: só os perfis local e test têm uma chave de desenvolvimento; noutro
    # perfil a aplicação não arranca sem ANDAIME_TOTP_KEY (gerar com: openssl rand -base64 32).
    totp-key: ${ANDAIME_TOTP_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    pt.andaime: INFO
