spring:
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  mail:
    test-connection: false

andaime:
  # Todos os pedidos de teste chegam do mesmo IP; o limite por IP tem teste unitário próprio.
  rate-limit:
    auth-per-minute: 100000
  # As tarefas agendadas são chamadas diretamente pelos testes.
  jobs:
    enabled: false
  # Os testes usam datas relativas a hoje: sem feriados nacionais no cálculo de horas, exceto em
  # PublicHolidaysIntegrationTest, que os liga explicitamente.
  holidays:
    national-in-hours: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
