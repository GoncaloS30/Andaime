<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/andaime.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#13342a" />
    <meta name="description" content="Andaime — gestão operacional para empresas de construção: planeamento, equipas, obras e horas." />
    <title>Andaime</title>
    <style>
      /* Ecrã de arranque estático: pintado antes do JavaScript; o React substitui-o. */
      html,body{margin:0;background:#f5f5f0}
      .boot{display:flex;min-height:100vh;font-family:system-ui,sans-serif;color:#1f2421}
      .boot-side{display:none;width:64px;background:#13342a}
      .boot-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
      .boot-mark{width:44px;height:44px}
      .boot-name{font-weight:700;font-size:20px;letter-spacing:-.01em;color:#13342a}
      .boot-note{font-size:13px;color:#545b56}
      .boot-bar{width:160px;height:3px;border-radius:3px;background:#dadcd5;overflow:hidden}
      .boot-bar i{display:block;width:40%;height:100%;background:#13342a;animation:bootp 1.1s ease-in-out infinite}
      @keyframes bootp{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
      @media (min-width:768px){.boot-side{display:block}}
      @media (min-width:1024px){.boot-side{width:240px}}
      @media (prefers-reduced-motion:reduce){.boot-bar i{animation:none;width:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="A carregar o Andaime">
        <div class="boot-side"></div>
        <div class="boot-main">
          <svg class="boot-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#13342a"/><path d="M9 7v18M23 7v18M9 12h14M9 20h14M9 12l14 8" stroke="#c8e26a" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
          <div class="boot-name">Andaime</div>
          <div class="boot-bar"><i></i></div>
          <div class="boot-note">A carregar…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
