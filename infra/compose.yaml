name: andaime

services:
  postgres:
    image: postgres:18-alpine
    container_name: andaime-postgres
    environment:
      POSTGRES_DB: andaime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
    ports:
      - "55442:5432"
    volumes:
      - andaime-postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d andaime"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: andaime-mailpit
    ports:
      - "51035:1025"
      - "58035:8025"
    restart: unless-stopped

  # Armazenamento de objetos compatível com S3 para documentos (só desenvolvimento; em produção, qualquer S3).
  # As imagens públicas do MinIO deixaram de ser publicadas; o SeaweedFS é open source e fala a mesma API.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    container_name: andaime-objectstore
    # Credenciais só de desenvolvimento local (as mesmas valores por omissão de application.yml).
    command: server -s3 -dir=/data -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "59010:8333"
    volumes:
      - andaime-objectstore-data:/data
      - ./objectstore/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  # Antivírus dos ficheiros carregados (opcional em desenvolvimento: `docker compose --profile antivirus up -d`).
  # Arranca em alguns minutos (descarrega as assinaturas) e usa cerca de 1 GB de RAM.
  clamav:
    image: clamav/clamav:1.4
    container_name: andaime-clamav
    profiles: [antivirus]
    ports:
      - "59310:3310"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    container_name: andaime-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      ANDAIME_DATABASE_URL: jdbc:postgresql://postgres:5432/andaime
      ANDAIME_DATABASE_OWNER: andaime_owner
      ANDAIME_DATABASE_OWNER_PASSWORD: ${ANDAIME_DATABASE_OWNER_PASSWORD:-andaime_owner_local}
      ANDAIME_DATABASE_USER: andaime_app
      ANDAIME_DATABASE_PASSWORD: ${ANDAIME_DATABASE_PASSWORD:-andaime_app_local}
      ANDAIME_MAIL_HOST: mailpit
      ANDAIME_MAIL_PORT: 1025
      ANDAIME_STORAGE_ENDPOINT: http://objectstore:8333
      ANDAIME_ANTIVIRUS_MODE: ${ANDAIME_ANTIVIRUS_MODE:-off}
      ANDAIME_ANTIVIRUS_HOST: clamav
      ANDAIME_ANTIVIRUS_PORT: 3310
      ANDAIME_ANTIVIRUS_TIMEOUT_MS: ${ANDAIME_ANTIVIRUS_TIMEOUT_MS:-30000}
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      objectstore:
        condition: service_started
    restart: unless-stopped

volumes:
  andaime-postgres-data:
  andaime-objectstore-data:
