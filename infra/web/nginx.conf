# nginx do Andaime (produção): serve a SPA e encaminha /api para o backend na mesma origem (sem CORS).
#
# É um template: o entrypoint da imagem nginx substitui ${ANDAIME_BACKEND} (host:porta do backend) e
# ${NGINX_LOCAL_RESOLVERS} (DNS do contentor) e grava o resultado em /etc/nginx/conf.d/default.conf.
# O TLS termina antes deste nginx (balanceador do fornecedor ou Caddy): ver docs/operacao/deploy.md.

server_tokens off;
charset utf-8;

# Endereço real do cliente: só se confia no X-Forwarded-For vindo de proxies em redes privadas (balanceador,
# Caddy na mesma rede Docker). O backend recebe sempre um X-Forwarded-For com um único IP (o do cliente), para
# que o limite por IP em /api/auth não possa ser contornado com um cabeçalho forjado.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Esquema original (https quando o TLS termina no proxy à frente; senão, o do próprio pedido).
map $http_x_forwarded_proto $andaime_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $andaime_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

# HSTS só quando o pedido chegou por HTTPS (um add_header com valor vazio não é enviado).
map $andaime_forwarded_proto $andaime_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# Cache: index.html nunca fica em cache; os ficheiros com hash do Vite (/assets) são imutáveis.
map $uri $andaime_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    /index.html "no-cache";
    default     "public, max-age=3600";
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml application/manifest+json;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Documentos até 15 MB (o backend aceita pedidos multipart até 16 MB).
    client_max_body_size 16m;
    client_body_buffer_size 1m;

    # Redireções relativas (sem a porta interna 8080 no Location).
    absolute_redirect off;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $andaime_backend ${ANDAIME_BACKEND};

    # Verificação do balanceador/Compose (só o nginx; a saúde do backend é verificada pelo Compose).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Actuator nunca pelo proxy (métricas ficam na porta de gestão interna do backend).
    location /actuator/ {
        return 404;
    }

    # Notificações em tempo real (Server-Sent Events): sem buffering e com leitura longa
    # (o backend fecha a ligação ao fim de 30 min e o browser volta a ligar).
    location ~ ^/api/orgs/[^/]+/notifications/stream$ {
        proxy_pass http://$andaime_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        error_page 502 504 = @api_unavailable;
    }

    location /api/ {
        proxy_pass http://$andaime_backend;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        error_page 502 504 = @api_unavailable;
    }

    # Backend em baixo ou a reiniciar: erro em JSON (problem+json), como os restantes erros da API.
    location @api_unavailable {
        default_type application/problem+json;
        add_header Cache-Control "no-store" always;
        return 503 '{"title":"Serviço temporariamente indisponível","status":503,"code":"unavailable"}';
    }

    # Ficheiros com hash: se não existirem, 404 (nunca o index.html no lugar de um .js).
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $andaime_cache_control always;
    }

    # SPA: qualquer rota sem ficheiro (ex.: /planeamento) devolve o index.html.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $andaime_cache_control always;
    }
}
