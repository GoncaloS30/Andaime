# Cabeçalhos do proxy para o backend (incluído nas localizações /api). Mesma origem: o Host é preservado.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Um único IP (o do cliente, já resolvido pelo real_ip): não se reencaminham valores forjados pelo cliente.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $andaime_forwarded_proto;
proxy_set_header X-Forwarded-Host $andaime_forwarded_host;
proxy_set_header X-Forwarded-Port "";
proxy_set_header Forwarded "";
proxy_redirect off;
