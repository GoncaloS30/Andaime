# Cabeçalhos de segurança da SPA (incluídos em cada localização estática: no nginx, um add_header numa
# localização anula os herdados do servidor). As respostas de /api trazem os cabeçalhos do Spring Security.
#
# CSP ajustada ao que a aplicação carrega:
#   - scripts e CSS próprios (Vite); 'unsafe-inline' só em style-src, para o ecrã de arranque em index.html e
#     para os estilos injetados em runtime (sonner, Leaflet);
#   - letras próprias (@fontsource, sem Google Fonts);
#   - mosaicos do OpenStreetMap nos mapas das obras (Leaflet) e imagens data:/blob:;
#   - API e notificações (EventSource) na mesma origem.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $andaime_hsts always;
